# 轻量 MySQL，端口 3307（避开默认 3306）
services:
  mysql:
    image: mysql:8.4
    container_name: zpdf-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zpdf_practice
      MYSQL_USER: zpdf
      MYSQL_PASSWORD: zpdf
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - zpdf_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  zpdf_mysql_data:
